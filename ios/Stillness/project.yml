name: Stillness
options:
  bundleIdPrefix: com.stillness
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  Stillness:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.stillness.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.0"
      ENABLE_PREVIEWS: true
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
