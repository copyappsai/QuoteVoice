name: QuoteVoice
options:
  bundleIdPrefix: com.quotevoice
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  QuoteVoice:
    type: application
    platform: iOS
    sources:
      - path: QuoteVoice/Sources
      - path: QuoteVoice/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.quotevoice.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: QuoteVoice/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.0"
      ENABLE_PREVIEWS: true
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
